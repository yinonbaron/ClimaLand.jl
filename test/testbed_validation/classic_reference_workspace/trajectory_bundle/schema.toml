  { names = ["driver.fg"], section = "drivers", role = "external_forcing", units = "1", dtype = "float64", dimensions = ["tile"], sampling = "instantaneous", application_phase = "before_heterotrophic_respiration" },
  { names = ["driver.rmrveg"], section = "drivers", role = "external_forcing", units = "umol CO2 m-2 s-1", dtype = "float64", dimensions = ["tile", "pft"], sampling = "interval_mean", application_phase = "pool_update_soilresp_audit" },
