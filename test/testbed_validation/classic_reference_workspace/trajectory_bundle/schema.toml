  { names = ["audit.humtrsvg"], section = "audit_diagnostics", role = "audit_diagnostic", units = "umol CO2 m-2 s-1", dtype = "float64", dimensions = ["tile", "pft_and_bare", "soil_layer"], sampling = "instantaneous", application_phase = "after_pool_update" },
  { names = ["audit.litter_clamp_correction", "audit.soil_clamp_correction"], section = "audit_diagnostics", role = "audit_diagnostic", units = "kg C m-2", dtype = "float64", dimensions = ["tile", "pft_and_bare", "soil_layer"], sampling = "instantaneous", application_phase = "after_pool_update" },
  { names = ["audit.turbation_delta_litter", "audit.turbation_delta_soil"], section = "audit_diagnostics", role = "audit_diagnostic", units = "kg C m-2 step-1", dtype = "float64", dimensions = ["tile", "pft_and_bare", "soil_layer"], sampling = "instantaneous", application_phase = "after_turbation" },
  { names = ["audit.hetrsveg"], section = "audit_diagnostics", role = "audit_diagnostic", units = "umol CO2 m-2 s-1", dtype = "float64", dimensions = ["tile", "pft_and_bare"], sampling = "instantaneous", application_phase = "after_pool_update" },
  { names = ["audit.litres", "audit.socres", "audit.hetrores", "audit.humiftrs"], section = "audit_diagnostics", role = "audit_diagnostic", units = "umol CO2 m-2 s-1", dtype = "float64", dimensions = ["tile"], sampling = "instantaneous", application_phase = "after_pool_update" },
