  { names = ["reference.before_turbation_litrmass", "reference.before_turbation_soilcmas"], section = "reference_state", role = "reference_state", units = "kg C m-2", dtype = "float64", dimensions = ["tile", "pft_and_bare", "soil_layer"], sampling = "instantaneous", application_phase = "before_turbation" },
