schema_version = 1

[workspace]
canonical_allocation_env = "WORK"
directory_name = "classic-v2-reference"
minimum_free_bytes = 8000000000
immutable_directories = [
    "immutable/archives",
]
replaceable_directories = [
    "replaceable/builds",
    "replaceable/cache",
    "replaceable/extracted",
    "replaceable/fixture-staging",
    "replaceable/runs",
    "replaceable/staging",
]

[prerequisites]
platform = "linux"
commands = ["apptainer", "tar", "md5sum"]

[source_pin]
repository = "https://gitlab.com/cccma/classic.git"
tag = "CLASSICv2.0"
commit = "7dd82c9a48a7c8beb6455a229888c90ba20d8eff"
archive_top_level = "classic-CLASSICv2.0"

[setup]
commands = [
    "julia --startup-file=no classic_workspace.jl check manifest.toml $WORK/classic-v2-reference",
    "julia --startup-file=no classic_workspace.jl init manifest.toml $WORK/classic-v2-reference",
    "julia --startup-file=no classic_workspace.jl fetch manifest.toml $WORK/classic-v2-reference",
    "julia --startup-file=no classic_workspace.jl verify manifest.toml $WORK/classic-v2-reference",
]

