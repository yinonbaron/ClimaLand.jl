prespin_casa_candidate = "casa_boreal_nfix"
prespin_mimics_candidate = "mimics_ko6_fi30"

[stages.prespin]
control_candidate = "casa_cn_prespin"
loops = 100
years = [1901, 1901]

[stages.accelerated_spin]
control = "GRID_CN/CASACNP_mod5_GSWP3_JAMES/fcasacnp_clm_spin_1901-1920_x500_STEP_2of4.lst"
loops = 499
years = [1901, 1920]

[stages.normal_spin]
control = "GRID_CN/CASACNP_mod5_GSWP3_JAMES/fcasacnp_clm_spin_1901-1920_x500_STEP_2bof4.lst"
loops = 499
years = [1901, 1920]

[stages.historical]
control = "GRID_CN/CASACNP_mod5_GSWP3_JAMES/fcasacnp_clm_HIST_1901_2014_STEP_3of4.lst"
loops = 1
years = [1901, 2014]

[transformation.passive_restoration]
boundary = "accelerated_spin -> normal_spin"
carbon_field = "casapool%csoil(PASS)"
carbon_multiplier = 10
nitrogen_field = "casapool%nsoil(PASS)"
nitrogen_rule = "byte-for-byte unchanged"
unaffected_columns_rule = "byte-for-byte unchanged"

[postprocessing]
annual_reduction = "ncra -O each daily year to one annual mean"
annual_concatenation = "ncrcat -O annual means in 1901-2014 order"
stream_completion = "the next year's file closes 1901-2013; process completion closes 2014"
annual_reference = "ann_casaclm_pool_flux_1901_2014.nc"
daily_windows = [[1901, 1905], [2010, 2014]]
nco_version_recorded_by_archive = "4.7.5"

[scientific_comparison]
plant_states = ["cleaf", "nleaf", "cwood", "nwood", "cfroot", "nfroot"]
organic_pools = ["clitmetb", "nlitmetb", "clitstr", "nlitstr", "clitcwd", "nlitcwd", "csoilmic", "nsoilmic", "csoilslow", "nsoilslow", "csoilpass", "nsoilpass"]
mineral_nitrogen = ["nMineral", "nMinDep", "nMinFix", "nMinUptake", "nMinLeach", "nMinLoss", "nLitMineralization", "nSoilMineralization", "nSoilImmob", "nNetMineralization"]
major_fluxes = ["cgpp", "cnpp", "cresp", "cLitInptMet", "cLitInptStruc", "cpassInpt", "nLitInptMet", "nLitInptStruc"]
cwd_nitrogen = ["nlitcwd", "nLitInptStruc"]
exudation_rule = "fracRootExudate is zero for all 18 PFTs in normal and accelerated parameter tables"

[compiler]
source_makefile_version = "GNU Fortran 8.1.0"
source_makefile_flags = "-O1 -C -fbacktrace -fbounds-check -fdefault-real-8 -fdefault-double-8 -fcheck=all -Wall"
