name: Representative Scientific Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  representative-shard:
    name: Representative shard / ${{ matrix.target.model }} / ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        target:
          - model: CORPSE
            slug: corpse
            reference_artifact: representative_corpse_reference
          - model: MIMICS-C
            slug: mimics-c
            reference_artifact: representative_mimics_c_reference
          - model: MIMICS-CN
            slug: mimics-cn
            reference_artifact: representative_mimics_cn_reference
          - model: CASA-C
            slug: casa-c
            reference_artifact: representative_casa_c_reference
          - model: CASA-CN
            slug: casa-cn
            reference_artifact: representative_casa_cn_reference
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: 180
    env:
      JULIA_NUM_THREADS: '1'
      MODEL: ${{ matrix.target.model }}
      MODEL_SLUG: ${{ matrix.target.slug }}
      REFERENCE_ARTIFACT: ${{ matrix.target.reference_artifact }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: '8'
      OPENBLAS_NUM_THREADS: '1'
      CLIMALAND_VALIDATION_TIMEOUT_SECONDS: '7200'
      VALIDATION_OUTPUT: validation-output
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Cache Julia depot and validation artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.julia/packages
            ~/.julia/compiled
            ~/.julia/artifacts
            ~/.julia/scratchspaces
            ~/.julia/registries
          key: representative-${{ runner.os }}-julia-1.12-${{ hashFiles('test/Project.toml', 'test/Manifest.toml', 'test/testbed_validation/validation/Artifacts.toml') }}
          restore-keys: |
            representative-${{ runner.os }}-julia-1.12-
      - name: Install validation dependencies
        run: julia --startup-file=no --project=test -e 'using Pkg; Pkg.develop(; path = "."); Pkg.instantiate()'
      - name: Stage pinned artifacts for this model
        id: stage_artifacts
        continue-on-error: true
        run: |
          mkdir -p "${VALIDATION_OUTPUT}/logs"
          set -o pipefail
          julia --startup-file=no --project=test -e '
            import Pkg
            artifacts_toml = joinpath(pwd(), "test", "testbed_validation", "validation", "Artifacts.toml")
            required = ("representative_forcing", ENV["REFERENCE_ARTIFACT"])
            hashes = map(name -> Pkg.Artifacts.artifact_hash(name, artifacts_toml), required)
            missing = filter(index -> isnothing(hashes[index]), eachindex(required))
            isempty(missing) || error(
                "Required pinned artifacts are unpublished: " *
                join(map(index -> required[index], missing), ", "),
            )
            for (name, hash) in zip(required, hashes)
                Pkg.Artifacts.ensure_artifact_installed(name, artifacts_toml)
                Pkg.Artifacts.artifact_exists(hash) || error("Required pinned artifact $name is unavailable")
                println("Staged $name ($hash)")
            end
          ' 2>&1 | tee "${VALIDATION_OUTPUT}/logs/artifact-staging.log"
      - name: Run one Representative model shard
        id: validation
        if: steps.stage_artifacts.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p "${VALIDATION_OUTPUT}/logs"
          set -o pipefail
          julia --startup-file=no --project=test \
            test/testbed_validation/validation_runner.jl \
            --scope representative \
            --models "${MODEL}" \
            --reference pinned \
            --shard-index "${SHARD_INDEX}" \
            --shard-count "${SHARD_COUNT}" \
            --workers 1 \
            --output "${VALIDATION_OUTPUT}" \
            2>&1 | tee "${VALIDATION_OUTPUT}/logs/validation-runner.log" &
          validation_pid=$!
          while kill -0 "${validation_pid}" 2>/dev/null; do
            if (( SECONDS >= 3600 )); then
              echo "::warning title=Representative shard exceeded its provisional performance budget::${MODEL} shard ${SHARD_INDEX}/${SHARD_COUNT} has run for more than one hour."
              break
            fi
            sleep 30
          done
          wait "${validation_pid}"
      - name: Preserve a compact preflight failure report
        if: always()
        env:
          STAGING_OUTCOME: ${{ steps.stage_artifacts.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          if [[ ! -f "${VALIDATION_OUTPUT}/validation_report.toml" ]]; then
            mkdir -p "${VALIDATION_OUTPUT}"
            {
              printf '%s\n' \
                'schema_version = 1' \
                'reference_mode = "pinned"' \
                'outcome = "failed"' \
                'seconds = 0.0' \
                "artifact_staging_outcome = \"${STAGING_OUTCOME}\"" \
                "validation_runner_outcome = \"${VALIDATION_OUTCOME}\"" \
                '' \
                '[shard]' \
                "index = ${SHARD_INDEX}" \
                "count = ${SHARD_COUNT}" \
                '' \
                '[scope]' \
                'name = "representative"' \
                'cell_count = 80' \
                '' \
                '[[model]]' \
                "name = \"${MODEL}\"" \
                'reference_mode = "pinned"' \
                'outcome = "failed"' \
                'seconds = 0.0' \
                '[model.coverage]' \
                'scope_cells = 80' \
                'eligible_cells = 0' \
                'compared_cells = 0' \
                'eligibility_gaps = []'
            } > "${VALIDATION_OUTPUT}/validation_report.toml"
          fi
      - name: Upload compact shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: representative-validation-shard-${{ matrix.target.slug }}-${{ matrix.shard }}
          path: validation-output/validation_report.toml
          if-no-files-found: error
          retention-days: 30
      - name: Upload detailed shard failure logs
        if: ${{ always() && (steps.stage_artifacts.outcome != 'success' || steps.validation.outcome != 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: representative-validation-failure-${{ matrix.target.slug }}-${{ matrix.shard }}
          path: validation-output/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce staging and scientific outcomes
        if: always()
        env:
          STAGING_OUTCOME: ${{ steps.stage_artifacts.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          [[ "${STAGING_OUTCOME}" == "success" ]] || {
            echo "Pinned forcing or ${MODEL} reference did not stage."
            exit 1
          }
          [[ "${VALIDATION_OUTCOME}" == "success" ]] || {
            echo "The public Validation Runner did not complete ${MODEL} shard ${SHARD_INDEX}/${SHARD_COUNT}."
            exit 1
          }

  aggregate-validation:
    name: Representative scientific validation
    needs: representative-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Cache Julia depot
        uses: actions/cache@v6
        with:
          path: |
            ~/.julia/packages
            ~/.julia/compiled
            ~/.julia/artifacts
            ~/.julia/scratchspaces
            ~/.julia/registries
          key: representative-${{ runner.os }}-julia-1.12-${{ hashFiles('test/Project.toml', 'test/Manifest.toml', 'test/testbed_validation/validation/Artifacts.toml') }}
          restore-keys: |
            representative-${{ runner.os }}-julia-1.12-
      - name: Install validation dependencies
        run: julia --startup-file=no --project=test -e 'using Pkg; Pkg.develop(; path = "."); Pkg.instantiate()'
      - name: Download shard reports
        id: download_reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          merge-multiple: false
          pattern: representative-validation-shard-*
          path: shard-reports
      - name: Aggregate shard reports
        id: aggregate
        if: always()
        continue-on-error: true
        run: |
          julia --startup-file=no --project=test \
            test/testbed_validation/aggregate_validation_shards.jl \
            --input shard-reports \
            --output validation-output \
            --shard-count 8 \
            --models all
      - name: Upload aggregate validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: representative-validation-report
          path: |
            validation-output/validation_report.toml
            validation-output/models/*/comparison_report.toml
          if-no-files-found: error
          retention-days: 30
      - name: Enforce matrix and aggregate outcomes
        if: always()
        env:
          MATRIX_OUTCOME: ${{ needs.representative-shard.result }}
          DOWNLOAD_OUTCOME: ${{ steps.download_reports.outcome }}
          AGGREGATION_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          [[ "${MATRIX_OUTCOME}" == "success" ]] || {
            echo "At least one Representative shard job failed or was cancelled."
            exit 1
          }
          [[ "${DOWNLOAD_OUTCOME}" == "success" ]] || {
            echo "The complete set of Representative shard reports was not downloaded."
            exit 1
          }
          [[ "${AGGREGATION_OUTCOME}" == "success" ]] || {
            echo "Representative shard aggregation failed closed."
            exit 1
          }
